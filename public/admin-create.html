<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNHA School App - Create Admin</title>
<link rel="stylesheet" href="style.css">
<!-- Firebase SDK -->
<script type="module">
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  
  // Get Firebase Auth and Firestore
  window.getFirebaseAuth = () => {
    if (typeof window.firebaseApp !== 'undefined' && window.firebaseApp) {
      return getAuth(window.firebaseApp);
    }
    return null;
  };
  
  window.createAdminUser = async (email, password) => {
    const auth = window.getFirebaseAuth();
    if (!auth) {
      throw new Error("Firebase Auth not initialized");
    }
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    return userCredential.user;
  };
  
  window.addAdminToCollection = async (uid, username) => {
    if (!window.db) {
      throw new Error("Firestore not initialized");
    }
    const adminData = {
      uid: uid,
      username: username,
      createdAt: new Date().toISOString()
    };
    await addDoc(collection(window.db, "admins"), adminData);
  };
</script>
</head>
<body>

<div class="login-container">
  <h1>TNHA School App</h1>
  <h2>Create Admin Account</h2>
  
  <div id="adminCreateForm" style="background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); min-width: 300px; max-width: 400px; margin: 0 auto;">
    <input type="text" id="adminUsername" placeholder="Username" autocomplete="username" style="display: block; margin: 15px auto; padding: 15px 20px; font-size: 16px; width: 100%; max-width: 280px; border-radius: 8px; border: 2px solid #e0e0e0; transition: border-color 0.3s; box-sizing: border-box;">
    <input type="password" id="adminPassword" placeholder="Password" autocomplete="new-password" style="display: block; margin: 15px auto; padding: 15px 20px; font-size: 16px; width: 100%; max-width: 280px; border-radius: 8px; border: 2px solid #e0e0e0; transition: border-color 0.3s; box-sizing: border-box;">
    <input type="text" id="masterUID" placeholder="Master UID" autocomplete="off" style="display: block; margin: 15px auto; padding: 15px 20px; font-size: 16px; width: 100%; max-width: 280px; border-radius: 8px; border: 2px solid #e0e0e0; transition: border-color 0.3s; box-sizing: border-box;">
    <button onclick="createAdmin()" style="padding: 15px 30px; margin: 10px 5px; font-size: 16px; border-radius: 8px; border: none; background: #667eea; color: white; cursor: pointer; transition: all 0.3s; font-weight: 600; min-width: 120px; width: 100%; max-width: 280px; display: block; margin: 20px auto;">Create Admin</button>
    <div id="adminCreateError" style="color: #dc3545; text-align: center; margin-top: 15px; display: none;"></div>
    <div id="adminCreateSuccess" style="color: #28a745; text-align: center; margin-top: 15px; display: none;"></div>
    <div style="text-align: center; margin-top: 20px;">
      <a href="index.html" style="color: #667eea; text-decoration: none;">Back to Login</a>
    </div>
  </div>
</div>

<script src="admin-create.js"></script>
</body>
</html>
