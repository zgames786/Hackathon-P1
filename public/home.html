<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Tracker - Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="hamburger" onclick="toggleSidebar()">☰</div>

<div id="sidebar">
  <button onclick="showTab('home')">🏠 Home</button>
  <button onclick="showTab('assignments')">📝 Assignments</button>
  <button onclick="showTab('calendar')">📅 Calendar</button>
  <button onclick="logout()">🚪 Logout</button>
</div>

<div class="header-title">Homework Tracker</div>
<div class="header-subtitle">Welcome, <span id="userNameDisplay"></span>!</div>

<div id="homeTab">
  <h2 style="text-align: center; color: #667eea; margin-bottom: 20px;">Assignment Overview</h2>
  <canvas id="piechart"></canvas>
  <div id="pieChartStats"></div>
  <div id="classesContainer"></div>
  <div style="text-align: center; margin: 20px 0;">
    <button id="joinClassBtn" onclick="joinClass()">Join Class</button>
    <button id="createClassBtn" onclick="createClass()">Create Class</button>
  </div>
</div>

<div id="assignmentsTab" style="display:none;">
  <h2 style="text-align: center; color: #667eea; margin-bottom: 20px;">My Assignments</h2>
  <div class="tab-buttons">
    <button class="tab-btn tab-selected" onclick="showAssignmentTab('active')">Active</button>
    <button class="tab-btn" onclick="showAssignmentTab('done')">Done</button>
    <button class="tab-btn" onclick="showAssignmentTab('missing')">Missing</button>
  </div>
  <div id="assignmentsContainer"></div>
  <div style="text-align: center;">
    <button id="addAssignmentBtn" onclick="addAssignment()">Add Assignment</button>
  </div>
</div>

<div id="calendarTab" style="display:none;">
  <h2 style="text-align: center; color: #667eea; margin-bottom: 20px;">Assignment Calendar</h2>
  <div id="calendarHeader">
    <button id="prevMonthBtn" onclick="prevMonth()">⬅️ Previous</button>
    <span id="monthYear"></span>
    <button id="nextMonthBtn" onclick="nextMonth()">Next ➡️</button>
  </div>
  <div id="calendarContainer"></div>
</div>

<script src="app.js"></script>
</body>
</html>
