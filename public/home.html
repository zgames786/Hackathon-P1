<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Tracker - Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="hamburger" onclick="toggleSidebar()">☰</div>

<div id="sidebar">
  <button onclick="showTab('dashboard')">🏠 Dashboard</button>
  <button onclick="showTab('assignments')">📝 Assignments</button>
  <button onclick="showTab('calendar')">📅 Calendar</button>
  <button onclick="showTab('statistics')">📊 Statistics</button>
  <button onclick="showTab('suggestions')">💡 Suggestions</button>
  <button onclick="logout()">🚪 Logout</button>
</div>

<div class="header-title">Homework Tracker</div>
<div class="header-subtitle">Welcome, <span id="userNameDisplay"></span>!</div>

<div id="dashboardTab">
  <h2 style="text-align: center; color: #667eea; margin-bottom: 20px;">Assignment Overview</h2>
  <canvas id="piechart"></canvas>
  <div id="pieChartStats"></div>
  <div id="classesContainer"></div>
  <div style="text-align: center; margin: 20px 0;">
    <button id="joinClassBtn" onclick="joinClass()">Join Class</button>
    <button id="createClassBtn" onclick="createClass()">Create Class</button>
  </div>
</div>

<div id="assignmentsTab" style="display:none;">
  <h2 style="text-align: center; color: #667eea; margin-bottom: 20px;">My Assignments</h2>
  <div id="assignmentsContainer"></div>
  <div style="text-align: center; margin-top: 20px;">
    <button id="addAssignmentBtn" onclick="addAssignment()" style="display:none;">Add Assignment</button>
  </div>
</div>

<div id="calendarTab" style="display:none;">
  <h2 style="text-align: center; color: #667eea; margin-bottom: 20px;">Assignment Calendar</h2>
  <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 15px; font-style: italic;">
    Assignments are displayed in the date boxes corresponding to their due dates. Due dates are in MM/DD/YYYY format.
  </p>
  <div id="calendarHeader">
    <button id="prevMonthBtn" onclick="prevMonth()">⬅️ Previous</button>
    <span id="monthYear"></span>
    <button id="nextMonthBtn" onclick="nextMonth()">Next ➡️</button>
  </div>
  <div id="calendarContainer"></div>
</div>

<div id="statisticsTab" style="display:none;">
  <h2 style="text-align: center; color: #667eea; margin-bottom: 20px;">Statistics</h2>
  <div id="statisticsContainer"></div>
</div>

<div id="suggestionsTab" style="display:none;">
  <h2 style="text-align: center; color: #667eea; margin-bottom: 20px;">Suggestions</h2>
  <div id="suggestionsContainer"></div>
</div>

<!-- FIREBASE SDK DO NOT CHANGE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase-init.js"></script>
<script src="app.js"></script>
</body>
</html>
