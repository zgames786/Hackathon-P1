<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNHA School App - Create Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
#adminCreateForm input {
    display: block;
    margin: 0 0 12px 0;
    padding: 16px 20px;
    font-size: 16px;
    width: 100%;
    max-width: 300px;
    border-radius: 8px;
    border: 2px solid #e0e0e0;
    transition: border-color 0.2s;
    box-sizing: border-box;
    background: white;
}

#adminCreateForm input:focus {
    outline: none;
    border-color: #667eea;
}

@media (max-width: 768px) {
    .login-left {
        max-width: 100% !important;
        padding: 0 20px;
    }
    
    #adminCreateForm {
        max-width: 100%;
    }
    
    #adminCreateForm input {
        max-width: 100%;
    }
    
    .login-form-buttons {
        max-width: 100% !important;
    }
}
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-container">
    <div class="login-left" style="max-width: 450px; margin: 0 auto;">
      <div id="title-container" style="justify-content: center; margin-bottom: 30px;">
        <img src="images/tnha-logo.png" id="tnha-logo" alt="TNHA Logo" style="width: 100px; height: auto;">
      </div>
      <h1 id="main-title" style="text-align: center; margin-bottom: 10px;">TNHA School App</h1>
      <h2 style="text-align: center; margin-bottom: 30px;">Create Admin Account</h2>
      
      <div id="adminCreateForm" style="max-width: 380px; margin: 0 auto;">
        <input type="text" id="adminFullName" placeholder="Full Name" autocomplete="name">
        <input type="email" id="adminEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="adminPassword" placeholder="Password" autocomplete="new-password">
        <div class="login-form-buttons">
          <button onclick="createAdmin()">Create Admin</button>
        </div>
        <div id="adminCreateMessage" style="text-align: center; margin-top: 15px; min-height: 20px;"></div>
        <div style="text-align: center; margin-top: 20px;">
          <a href="index.html" style="color: #667eea; text-decoration: none; font-size: 14px;">Back to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- FIREBASE SDK DO NOT CHANGE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase-init.js"></script>
<script src="create-admin.js"></script>
</body>
</html>
