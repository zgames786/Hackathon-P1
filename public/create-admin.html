<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNHA School App - Create Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.create-admin-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
}

.create-admin-card {
    background: white;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    width: 100%;
    max-width: 380px;
    padding: 32px;
    text-align: center;
}

.create-admin-card .logo-container {
    margin-bottom: 24px;
}

.create-admin-card .logo-container img {
    width: 100px;
    height: auto;
}

.create-admin-card h2 {
    font-size: 22px;
    margin: 0 0 24px 0;
    color: #5D6D7E;
    font-weight: 500;
}

#adminCreateForm {
    width: 100%;
}

#adminCreateForm input {
    display: block;
    margin: 0 0 12px 0;
    padding: 16px 20px;
    font-size: 16px;
    width: 100%;
    max-width: 300px;
    border-radius: 8px;
    border: 2px solid #e0e0e0;
    transition: border-color 0.2s;
    box-sizing: border-box;
    background: white;
    margin-left: auto;
    margin-right: auto;
}

#adminCreateForm input:focus {
    outline: none;
    border-color: #667eea;
}

#adminCreateForm .login-form-buttons {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    width: 100%;
    max-width: 300px;
    margin-left: auto;
    margin-right: auto;
}

#adminCreateForm .login-form-buttons button {
    flex: 1;
    padding: 16px 24px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #667eea;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 600;
}

#adminCreateForm .login-form-buttons button:hover {
    background: #5568d3;
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}

#adminCreateForm .login-form-buttons button:active {
    transform: translateY(0);
}

#adminCreateMessage {
    text-align: center;
    margin-top: 15px;
    min-height: 20px;
    font-size: 14px;
}

.back-link {
    text-align: center;
    margin-top: 20px;
}

.back-link a {
    color: #667eea;
    text-decoration: none;
    font-size: 14px;
}

@media (max-width: 768px) {
    .create-admin-card {
        padding: 24px 20px;
    }
    
    #adminCreateForm input {
        max-width: 100%;
    }
    
    #adminCreateForm .login-form-buttons {
        max-width: 100%;
    }
}
</style>
</head>
<body>

<div class="create-admin-wrapper">
  <div class="create-admin-card">
    <div class="logo-container">
      <img src="images/tnha-logo.png" alt="TNHA Logo">
    </div>
    <h2>Create Admin Account</h2>
    
    <div id="adminCreateForm">
      <input type="text" id="adminFullName" placeholder="Full Name" autocomplete="name">
      <input type="email" id="adminEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="adminPassword" placeholder="Password" autocomplete="new-password">
      <div class="login-form-buttons">
        <button onclick="createAdmin()">Create Admin</button>
      </div>
      <div id="adminCreateMessage"></div>
      <div class="back-link">
        <a href="index.html">Back to Login</a>
      </div>
    </div>
  </div>
</div>

<!-- FIREBASE SDK DO NOT CHANGE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase-init.js"></script>
<script src="create-admin.js"></script>
</body>
</html>
