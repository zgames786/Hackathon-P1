<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNHA School App - Fees</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="hamburger" onclick="toggleSidebar()">☰</div>

<div id="sidebar">
  <button onclick="navigateToAdminTab('dashboard')">🏠 Dashboard</button>
  <button onclick="navigateToAdminTab('communication')">💬 Communication</button>
  <button onclick="navigateTo('fees.html')">💰 Fees</button>
  <button onclick="navigateToAdminTab('expenses')">📊 Expenses</button>
  <button onclick="navigateToAdminTab('transport')">🚌 Transport</button>
  <button onclick="navigateToAdminTab('reports')">📈 Reports</button>
  <button onclick="navigateTo('attendance.html')">✅ Attendance</button>
  <button onclick="navigateToAdminTab('admin')">👨‍💼 Management</button>
  <button onclick="navigateTo('account-creation.html')">➕ Account Creation</button>
  <button onclick="navigateTo('accounts.html')">👥 Accounts</button>
  <button onclick="navigateToAdminTab('help')">❓ Help</button>
  <button onclick="logout()">🚪 Logout</button>
</div>

<div class="header-title">TNHA School App - Fees</div>
<div class="header-subtitle">Welcome, <span id="userNameDisplay"></span>!</div>

<div id="feesTab">
  <!-- Fees content will be loaded by fees.js -->
</div>

<!-- FIREBASE SDK DO NOT CHANGE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase-init.js"></script>
<script src="app.js"></script>
<script src="sidebar-nav.js"></script>
<script src="admin.js"></script>
<script src="fees.js"></script>

<script>
// Make adminData and getFirestoreDocs globally accessible for fees.js
window.adminData = adminData;
window.getFirestoreDocs = getFirestoreDocs;

// Initialize fees page
window.onload = async function() {
    if (window.location.pathname.includes("fees.html")) {
        const hasAccess = await checkAdminAccess();
        if (!hasAccess) {
            return;
        }
        
        // Display admin username or UID
        const storedUsername = localStorage.getItem("loggedInUser");
        const adminUID = localStorage.getItem("adminUID");
        const displayName = storedUsername ? storedUsername.replace("admin_", "") : adminUID;
        if (document.getElementById("userNameDisplay")) {
            document.getElementById("userNameDisplay").innerText = displayName;
        }
        
        // Load admin data first, then fees data
        await loadAdminData();
        if (window.loadFeesData) {
            await window.loadFeesData();
        }
    }
};

// Toggle sidebar
function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    if (sidebar) {
        sidebar.classList.toggle("show");
    }
}

// Logout function
function logout() {
    localStorage.removeItem("loggedInUser");
    localStorage.removeItem("userType");
    localStorage.removeItem("adminUID");
    window.location.href = "index.html";
}
</script>

</body>
</html>
