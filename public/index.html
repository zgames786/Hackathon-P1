<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNHA School App - Login</title>
<link rel="stylesheet" href="style.css">
<!-- Firebase SDK -->
<script type="module">
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  
  // Get Firebase Auth and Firestore
  window.getFirebaseAuth = () => {
    if (typeof window.firebaseApp !== 'undefined' && window.firebaseApp) {
      return getAuth(window.firebaseApp);
    }
    return null;
  };
  
  window.signInWithEmailAndPassword = async (auth, email, password) => {
    return await signInWithEmailAndPassword(auth, email, password);
  };
  
  // Initialize Firestore if not already initialized
  if (typeof window.db === 'undefined') {
    if (typeof window.firebaseApp !== 'undefined' && window.firebaseApp) {
      window.db = getFirestore(window.firebaseApp);
    }
  }
  
  // Make Firestore functions available globally
  if (!window.getFirestoreDocs) {
    window.getFirestoreDocs = async (collectionName) => {
      if (!window.db) {
        console.error("Firestore not initialized");
        return [];
      }
      try {
        const querySnapshot = await getDocs(collection(window.db, collectionName));
        const docs = [];
        querySnapshot.forEach((doc) => {
          docs.push({ id: doc.id, ...doc.data() });
        });
        return docs;
      } catch (error) {
        console.error("Error reading from Firestore:", error);
        return [];
      }
    };
  }
</script>
</head>
<body>
<div class="login-container">
  <h1>TNHA School App</h1>
  <h2>Select Account Type</h2>
  <div class="account-choice">
    <button onclick="selectType('student')">Student 📚</button>
    <button onclick="selectType('teacher')">Teacher ✏️</button>
    <button onclick="selectType('admin')">Admin 👨‍💼</button>
  </div>

  <div id="loginForm" style="display:none;">
    <input type="text" id="username" placeholder="Username" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button onclick="login()">Login</button>
    <button id="createAccountBtn" onclick="createAccount()">Create Account</button>
    <div style="text-align: center; margin-top: 15px;">
      <a href="admin-create.html" style="color: #667eea; text-decoration: none; font-size: 14px;">Create Admin Account</a>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
