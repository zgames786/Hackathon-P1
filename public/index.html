<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNHA School App - Login</title>
<link rel="stylesheet" href="style.css">
<!-- FIREBASE SDK DO NOT CHANGE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase-init.js"></script>
</head>
<body>
<div class="login-container">
  <h1>TNHA School App</h1>
  <h2>Select Account Type</h2>
  <div class="account-choice">
    <button onclick="selectType('student')">Student 📚</button>
    <button onclick="selectType('teacher')">Teacher ✏️</button>
    <button onclick="selectType('admin')">Admin 👨‍💼</button>
  </div>

  <div id="loginForm" style="display:none;">
    <input type="text" id="username" placeholder="Username" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <input type="text" id="masterUID" placeholder="Master UID (Admin only)" autocomplete="off" style="display:none;">
    <div style="text-align: center;">
      <button onclick="login()">Login</button>
      <button id="createAccountBtn" onclick="createAccount()">Create Account</button>
    </div>
    <div id="createAdminLink" style="text-align: center; margin-top: 15px; display:none;">
      <a href="admin-create.html" style="color: #667eea; text-decoration: none; font-size: 14px;">Create Admin Account</a>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
