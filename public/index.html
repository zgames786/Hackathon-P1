<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNHA School App - Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- FIREBASE SDK DO NOT CHANGE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase-init.js"></script>
</head>
<body>
<div class="login-wrapper">
  <div class="login-container">
    <div class="login-left">
      <div id="title-container">
        <img src="images/tnha-logo.png" id="tnha-logo" alt="TNHA Logo">
        <h1 id="main-title">TNHA School App</h1>
      </div>
      <h2>Login</h2>

      <div id="loginForm">
        <label for="roleSelect" style="display: block; margin-bottom: 8px; color: #5D6D7E; font-weight: 500; font-size: 14px;">Select Role</label>
        <select id="roleSelect" style="display: block; margin: 0 0 12px 0; padding: 16px 20px; font-size: 16px; width: 100%; max-width: 300px; border-radius: 8px; border: 2px solid #e0e0e0; transition: border-color 0.2s; box-sizing: border-box; background: white; cursor: pointer;">
          <option value="student">Student 📚</option>
          <option value="teacher">Teacher ✏️</option>
          <option value="admin">Admin 👨‍💼</option>
        </select>
        <input type="text" id="username" placeholder="Username" autocomplete="username">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
        <div class="login-form-buttons">
          <button onclick="login()">Login</button>
        </div>
        <div id="createAdminLink" style="text-align: center; margin-top: 15px; display:none;">
          <a href="admin-create.html" style="color: #667eea; text-decoration: none; font-size: 14px;">Create Admin Account</a>
        </div>
      </div>
    </div>

    <div class="login-right">
      <div class="photo-rotator">
        <img id="rotatingPhoto" src="images/photo1.jpg" alt="Awards photo">
      </div>
      <div class="quote-rotator">
        <p id="rotatingQuote">An investment in knowledge pays the best interest.</p>
        <div class="quote-dots">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<footer id="site-footer">
  <p>© 2025 The New Heights Academy Kairana. Learn Today to Lead Tomorrow. Contact: <a href="mailto:tnha.school">tnha.school</a></p>
</footer>

<script src="password-utils.js"></script>
<script src="app.js"></script>
<script src="login-rotator.js"></script>
</body>
</html>
