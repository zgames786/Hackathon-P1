<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Paper texture base with subtle grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 0.02 0.01 0.03 0.01 0.02 0.01 0.02"/>
      </feComponentTransfer>
    </filter>
    
    <!-- Pattern with very subtle book and pencil icons -->
    <pattern id="educationalPattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Base paper texture -->
      <rect width="200" height="200" fill="#E8DDC8" filter="url(#grain)"/>
      
      <!-- Very subtle book and pencil icons at low opacity -->
      <text x="30" y="50" font-size="14" fill="#8B6F47" opacity="0.08">📚</text>
      <text x="120" y="80" font-size="12" fill="#8B6F47" opacity="0.08">✏️</text>
      <text x="80" y="140" font-size="14" fill="#8B6F47" opacity="0.08">📚</text>
      <text x="160" y="30" font-size="12" fill="#8B6F47" opacity="0.08">✏️</text>
      <text x="50" y="180" font-size="14" fill="#8B6F47" opacity="0.08">📚</text>
      <text x="180" y="150" font-size="12" fill="#8B6F47" opacity="0.08">✏️</text>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#educationalPattern)"/>
</svg>
