<svg width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft paper texture filter -->
    <filter id="paperTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 0.012 0.008 0.018 0.008 0.012 0.008 0.012"/>
      </feComponentTransfer>
    </filter>
    
    <!-- Pattern with printed-looking book and pencil icons -->
    <pattern id="educationalPattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Paper texture overlay with very low opacity -->
      <rect width="120" height="120" fill="rgba(255,255,255,0.12)" filter="url(#paperTexture)"/>
      
      <!-- Printed-style book and pencil icons in a regular grid pattern (looks printed) -->
      <text x="20" y="35" font-size="10" fill="#8B6F47" opacity="0.04">📚</text>
      <text x="80" y="35" font-size="8" fill="#8B6F47" opacity="0.04">✏️</text>
      <text x="20" y="90" font-size="10" fill="#8B6F47" opacity="0.04">📚</text>
      <text x="80" y="90" font-size="8" fill="#8B6F47" opacity="0.04">✏️</text>
    </pattern>
  </defs>
  <rect width="120" height="120" fill="url(#educationalPattern)"/>
</svg>
