<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 80px;
    }
    .box {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      margin: auto;
      box-shadow: 0 0 10px #000;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 8px;
      border-radius: 5px;
      border: none;
    }
    button {
      width: 95%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 5px;
      background: #00aaff;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Homework Tracker Login</h1>

<div class="box">
  <h2>Login</h2>

  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="create()">Create Account</button>
</div>

<script>
  // Create Account
  function create() {
    const user = document.getElementById("user").value.trim();
    const pass = document.getElementById("pass").value.trim();

    if(!user || !pass) return alert("Enter username + password");

    if(localStorage.getItem("user_" + user)) {
      return alert("User already exists!");
    }

    const data = {
      password: pass,
      assignments: []
    };

    localStorage.setItem("user_" + user, JSON.stringify(data));

    alert("Account created!");
  }

  // Login
  function login() {
    const user = document.getElementById("user").value.trim();
    const pass = document.getElementById("pass").value.trim();

    const stored = localStorage.getItem("user_" + user);
    if(!stored) return alert("User does not exist.");

    const data = JSON.parse(stored);

    if(data.password !== pass) return alert("Wrong password.");

    localStorage.setItem("currentUser", user);

    window.location.href = "home.html";
  }
</script>

</body>
</html>
