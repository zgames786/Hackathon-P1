<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home Dashboard</title>
<style>
body { font-family: Arial, sans-serif; margin:20px; }
.menu { background:black; color:white; padding:15px; font-size:26px; cursor:pointer; position:fixed; top:0; left:0; width:100%; z-index:10; }
.sidebar { width:200px; height:100vh; background:#222; position:fixed; top:0; left:-200px; transition:0.3s; padding-top:60px; z-index:9; }
.sidebar a { display:block; padding:12px; color:white; text-decoration:none; font-size:18px; }
.sidebar a:hover { background:#444; }
.section { margin-top:90px; margin-left:20px; }
button, input { padding:8px 12px; margin:5px 0; }
</style>
</head>
<body>

<div class="menu">☰</div>
<div id="side" class="sidebar">
  <a href="home.html">Home</a>
  <a href="assignments.html">Assignments</a>
  <a href="#" onclick="logout()">Logout</a>
</div>

<div class="section">
<h2>Welcome!</h2>
<div id="dashboardArea"></div>
</div>

<script>
window.onload = function(){
    let currentUser = sessionStorage.getItem("currentUser");
    let currentType = sessionStorage.getItem("currentType");
    if(!currentUser || !currentType){ alert("Not logged in"); window.location.href="index.html"; return; }

    let dashboard = document.getElementById("dashboardArea");

    if(currentType === "student"){
        dashboard.innerHTML = `
        <h3>Student Dashboard</h3>
        <input type="text" id="joinCode" placeholder="Enter Class Code">
        <button onclick="joinClass()">Join Classroom</button>
        <div id="joinedClasses"></div>
        `;
        displayJoinedClasses();
    } else if(currentType === "teacher"){
        dashboard.innerHTML = `
        <h3>Teacher Dashboard</h3>
        <button onclick="createClass()">Create Classroom</button>
        <div id="createdClasses"></div>
        `;
        displayCreatedClasses();
    }

    // Sidebar toggle
    let sidebar = document.getElementById("side");
    document.querySelector(".menu").addEventListener('click', ()=>{ sidebar.style.left = (sidebar.style.left==="0px")?"-200px":"0px"; });
    document.querySelectorAll('#side a').forEach(link=>link.addEventListener('click', ()=>{ sidebar.style.left="-200px"; }));

    window.logout = function(){ sessionStorage.clear(); window.location.href="index.html"; }

    // STUDENT
    window.joinClass = function(){
        let code = document.getElementById("joinCode").value.trim();
        if(!code){ alert("Enter a class code"); return; }
        let classData = JSON.parse(localStorage.getItem("class_" + code));
        if(!classData){ alert("Class not found"); return; }
        if(!classData.students.includes(currentUser)){
            classData.students.push(currentUser);
            localStorage.setItem("class_" + code, JSON.stringify(classData));
        }
        alert("Joined class "+code);
        displayJoinedClasses();
    }

    function displayJoinedClasses(){
        let classesDiv = document.getElementById("joinedClasses");
        classesDiv.innerHTML = "<h4>Joined Classes:</h4>";
        for(let key in localStorage){
            if(key.startsWith("class_")){
                let c = JSON.parse(localStorage.getItem(key));
                if(c.students && c.students.includes(currentUser)){
                    classesDiv.innerHTML += `<div>${key.replace("class_","")}</div>`;
                }
            }
        }
    }

    // TEACHER
    window.createClass = function(){
        let code = generateCode(7);
        let classObj = {teacher: currentUser, students:[], assignments:[]};
        localStorage.setItem("class_" + code, JSON.stringify(classObj));
        alert("Created class! Code: "+code);
        displayCreatedClasses();
    }

    function displayCreatedClasses(){
        let classesDiv = document.getElementById("createdClasses");
        classesDiv.innerHTML = "<h4>Your Classes:</h4>";
        for(let key in localStorage){
            if(key.startsWith("class_")){
                let c = JSON.parse(localStorage.getItem(key));
                if(c.teacher === currentUser){
                    classesDiv.innerHTML += `<div>${key.replace("class_","")}</div>`;
                }
            }
        }
    }

    function generateCode(length){
        let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        let code = "";
        for(let i=0;i<length;i++){ code += chars.charAt(Math.floor(Math.random()*chars.length)); }
        return code;
    }
}
</script>
</body>
</html>
