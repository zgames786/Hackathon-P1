<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Homework Tracker MVP</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="hamburger" onclick="toggleSidebar()">☰</div>

<div id="sidebar">
  <button onclick="showTab('home')">Home</button>
  <button onclick="showTab('assignments')">Assignments</button>
  <button onclick="showTab('calendar')">Calendar</button>
</div>

<div class="header-title">Homework Tracker MVP</div>
<div class="header-subtitle">Welcome <span id="userNameDisplay"></span></div>

<div id="homeTab">
  <canvas id="piechart"></canvas>
  <div id="classesContainer"></div>
  <button onclick="joinClass()">Join Class</button>
  <button onclick="createClass()">Create Class</button>
</div>

<div id="assignmentsTab" style="display:none;">
  <div class="tab-buttons">
    <button class="tab-btn tab-selected" onclick="showAssignmentTab('active')">Active</button>
    <button class="tab-btn" onclick="showAssignmentTab('done')">Done</button>
    <button class="tab-btn" onclick="showAssignmentTab('missing')">Missing</button>
  </div>
  <div id="assignmentsContainer"></div>
  <button id="addAssignmentBtn" onclick="addAssignment()">Add Assignment</button>
</div>

<div id="calendarTab" style="display:none;">
  <div id="calendarHeader">
    <button id="prevMonthBtn" onclick="prevMonth()">⬅️</button>
    <span id="monthYear"></span>
    <button id="nextMonthBtn" onclick="nextMonth()">➡️</button>
  </div>
  <div id="calendarContainer"></div>
</div>

<div id="userGuide"></div>

<script src="app.js"></script>
</body>
</html>
