<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#111; color:white; }
    .menu { background:black; color:white; padding:15px; font-size:26px; cursor:pointer; }
    .sidebar {
      width:200px; height:100vh; background:#222; position:fixed;
      top:0; left:-200px; transition:0.3s; padding-top:60px;
    }
    .sidebar a { display:block; padding:12px; color:white; text-decoration:none; font-size:18px; }
    .sidebar a:hover { background:#444; }
    h1 { padding:20px; margin-left:20px; }
  </style>
</head>
<body>

<div class="menu" onclick="toggleMenu()">☰</div>

<div id="side" class="sidebar">
  <a href="home.html">Home</a>
  <a href="assignments.html">Assignments</a>
  <a href="#" onclick="logout()">Logout</a>
</div>

<h1>Homework Tracker MVP</h1>

<script>
let currentUser = sessionStorage.getItem("currentUser");
if(!currentUser){ alert("Not logged in"); window.location.href="index.html"; }

function toggleMenu() {
  let bar = document.getElementById("side");
  bar.style.left = (bar.style.left==="0px")?"-200px":"0px";
}

function closeMenu(){ document.getElementById("side").style.left="-200px"; }
document.querySelectorAll('#side a').forEach(link => link.addEventListener('click', closeMenu));

function logout(){
  sessionStorage.removeItem("currentUser");
  window.location.href="index.html";
}
</script>

</body>
</html>
