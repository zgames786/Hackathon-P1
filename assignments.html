<!DOCTYPE html>
<html>
<head>
  <title>Assignments - Homework Tracker MVP</title>
  <style>
    body{font-family:sans-serif;margin:0;padding:0;}
    .header{background:black;color:white;padding:20px;text-align:center;}
    .sidebar{width:200px;background:#333;color:white;position:fixed;top:0;left:0;height:100%;padding-top:50px;display:none;}
    .sidebar button{width:100%;padding:10px;margin-bottom:5px;color:white;background:none;border:none;text-align:left;cursor:pointer;}
    .main{margin-left:0;padding:20px;}
    .tab button{margin-right:5px;padding:5px;}
    .tab button.active{background:#007bff;color:white;}
    .assign-box{border:1px solid #ccc;padding:10px;margin:5px;border-radius:5px;}
    .assign-buttons button{margin-left:5px;}
    .top-left{position:absolute;top:0;left:0;background:black;color:white;padding:10px;cursor:pointer;}
  </style>
</head>
<body>
<div class="top-left" onclick="toggleSidebar()">☰</div>
<div class="sidebar" id="sidebar">
  <button onclick="showTab('active')">Active</button>
  <button onclick="showTab('done')">Done</button>
  <button onclick="showTab('missing')">Missing</button>
</div>
<div class="header">
  <h1>Homework Tracker MVP</h1>
  <div id="welcome"></div>
</div>
<div class="main">
  <div class="tab">
    <button class="active" data-tab="active">Active</button>
    <button data-tab="done">Done</button>
    <button data-tab="missing">Missing</button>
    <button onclick="addAssignment()">+ Add Assignment</button>
  </div>
  <div id="activeTab"></div>
  <div id="doneTab" style="display:none;"></div>
  <div id="missingTab" style="display:none;"></div>
</div>

<script>
let currentUser = sessionStorage.getItem("currentUser") || localStorage.getItem("lastUser");
let currentType = sessionStorage.getItem("currentType") || localStorage.getItem("lastType");
if(currentUser && currentType){
  sessionStorage.setItem("currentUser", currentUser);
  sessionStorage.setItem("currentType", currentType);
}else{
  alert("Not logged in");
  window.location.href="index.html";
}

document.getElementById("welcome").innerText="Welcome, "+currentUser;

let assignments = JSON.parse(localStorage.getItem(currentUser+"_assignments")||"[]");

function renderAssignments(){
  let activeTab=document.getElementById("activeTab");
  let doneTab=document.getElementById("doneTab");
  let missingTab=document.getElementById("missingTab");
  activeTab.innerHTML=""; doneTab.innerHTML=""; missingTab.innerHTML="";
  assignments.forEach((a,i)=>{
    let box=document.createElement("div"); box.className="assign-box";
    let inner=`<span>${a.name} - Due: ${a.due}</span>`;
    let btns='';
    if(currentType==="student"){
      btns=`<div class="assign-buttons">
              ${a.statuses[currentUser]!=="done"?`<button onclick="markDone(${i})">Done</button>`:''}
              ${a.statuses[currentUser]!=="missing"?`<button onclick="markMissing(${i})">Missing</button>`:''}
              </div>`;
    }
    if(currentType==="teacher"){
      btns=`<div class="assign-buttons">
              <button onclick="deleteAssign(${i})">Delete</button>
              <button onclick="editDue(${i})">Change Due</button>
            </div>`;
    }
    box.innerHTML=inner+btns;
    if(currentType==="student"){
      if(a.statuses[currentUser]==="active") activeTab.appendChild(box);
      else if(a.statuses[currentUser]==="done") doneTab.appendChild(box);
      else if(a.statuses[currentUser]==="missing") missingTab.appendChild(box);
    } else { activeTab.appendChild(box); }
  });
}

window.markDone=function(i){ assignments[i].statuses[currentUser]="done"; save(); renderAssignments();}
window.markMissing=function(i){ assignments[i].statuses[currentUser]="missing"; save(); renderAssignments();}
window.deleteAssign=function(i){ if(confirm("Delete assignment?")){ assignments.splice(i,1); save(); renderAssignments(); }}
window.editDue=function(i){ let d=prompt("New due date (MM/DD/YYYY HH:MM)",assignments[i].due); if(d){ assignments[i].due=d; save(); renderAssignments();}}

window.addAssignment=function(){
  let name=prompt("Assignment Name");
  if(!name) return;
  let due=prompt("Due Date (MM/DD/YYYY HH:MM)","11/23/2025 12:00");
  if(!due) return;
  assignments.push({name:name,due:due,statuses:{}});
  save(); renderAssignments();
}

function save(){ localStorage.setItem(currentUser+"_assignments",JSON.stringify(assignments)); }

document.querySelectorAll('.tab button[data-tab]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('activeTab').style.display="none";
    document.getElementById('doneTab').style.display="none";
    document.getElementById('missingTab').style.display="none";
    if(btn.dataset.tab==="active") document.getElementById('activeTab').style.display="block";
    if(btn.dataset.tab==="done") document.getElementById('doneTab').style.display="block";
    if(btn.dataset.tab==="missing") document.getElementById('missingTab').style.display="block";
  });
});

function toggleSidebar(){
  let sb=document.getElementById("sidebar");
  sb.style.display=sb.style.display==="block"?"none":"block";
}

renderAssignments();
</script>
</body>
</html>
