<!DOCTYPE html>
<html>
<head>
  <title>Login - Homework Tracker MVP</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .login-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.2); text-align: center; width: 350px; }
    .role-btn { padding: 10px 20px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; font-size: 16px; }
    #roleSelection { margin-bottom: 20px; }
    input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
    button { padding: 10px 20px; margin: 10px; font-size: 16px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Homework Tracker MVP</h2>

  <div id="roleSelection">
    <button class="role-btn" onclick="setRole('student')">Student</button>
    <button class="role-btn" onclick="setRole('teacher')">Teacher</button>
  </div>

  <div id="loginForm" style="display:none;">
    <input type="text" id="username" placeholder="Username"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <button onclick="createAccount()">Create Account</button>
  </div>

</div>

<script>
let currentRole = null;

function setRole(role){
  currentRole = role;
  document.getElementById("loginForm").style.display = "block";
  document.getElementById("roleSelection").style.display = "none";
}

function createAccount(){
  let username = document.getElementById("username").value.trim();
  let password = document.getElementById("password").value;
  if(!username || !password){ alert("Enter username and password"); return; }

  let key = currentRole+"_users";
  let users = JSON.parse(localStorage.getItem(key)||"{}");
  if(users[username]){ alert("Username already exists"); return; }
  users[username] = password;
  localStorage.setItem(key, JSON.stringify(users));
  alert("Account created! You can now login.");
}

function login(){
  let username = document.getElementById("username").value.trim();
  let password = document.getElementById("password").value;
  if(!username || !password){ alert("Enter username and password"); return; }

  let key = currentRole+"_users";
  let users = JSON.parse(localStorage.getItem(key)||"{}");
  if(users[username] && users[username] === password){
    sessionStorage.setItem("currentUser", username);
    sessionStorage.setItem("currentType", currentRole);
    localStorage.setItem("lastUser", username);
    localStorage.setItem("lastType", currentRole);
    window.location.href = "home.html";
  } else {
    alert("Invalid username or password");
  }
}
</script>

</body>
</html>
