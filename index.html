<!DOCTYPE html>
<html>
<head>
  <title>Login - Homework Tracker MVP</title>
  <style>
    body{font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#f0f0f0;}
    .container{background:white;padding:30px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.2);}
    input, button{padding:10px;margin:5px;width:200px;}
    #msg{color:red;}
    .role-btn{padding:10px 20px;margin:5px;cursor:pointer;}
    .role-selected{background:#007bff;color:white;}
  </style>
</head>
<body>
<div class="container">
  <h1>Homework Tracker MVP</h1>
  <div>
    <button id="studentBtn" class="role-btn">Student</button>
    <button id="teacherBtn" class="role-btn">Teacher</button>
  </div>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <button onclick="createAccount()">Create Account</button>
  <div id="msg"></div>
</div>

<script>
let role=null;
document.getElementById("studentBtn").onclick=()=>{
  role="student";
  document.getElementById("studentBtn").classList.add("role-selected");
  document.getElementById("teacherBtn").classList.remove("role-selected");
}
document.getElementById("teacherBtn").onclick=()=>{
  role="teacher";
  document.getElementById("teacherBtn").classList.add("role-selected");
  document.getElementById("studentBtn").classList.remove("role-selected");
}

function login(){
  let user=document.getElementById("username").value.trim();
  let pass=document.getElementById("password").value.trim();
  let msg=document.getElementById("msg");
  msg.innerText="";
  if(!role){ msg.innerText="Select Student or Teacher"; return; }
  if(!user || !pass){ msg.innerText="Fill username and password"; return; }
  let key = role+"_"+user;
  let data = JSON.parse(localStorage.getItem(key));
  if(!data || data.password!==pass){ msg.innerText="Invalid login"; return; }
  sessionStorage.setItem("currentUser",user);
  sessionStorage.setItem("currentType",role);
  localStorage.setItem("lastUser",user);
  localStorage.setItem("lastType",role);
  window.location.href="home.html";
}

function createAccount(){
  let user=prompt("Choose Username").trim();
  if(!user) return;
  let pass=prompt("Choose Password").trim();
  if(!pass) return;
  if(!role){ alert("Select Student or Teacher"); return; }
  let key=role+"_"+user;
  if(localStorage.getItem(key)){ alert("Account exists"); return; }
  localStorage.setItem(key,JSON.stringify({password:pass,classes:[],assignments:[]}));
  alert("Account created! You can now login.");
}
</script>
</body>
</html>
