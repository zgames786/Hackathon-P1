<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login / Create Account</title>
<style>
body { font-family: Arial, sans-serif; margin:50px; }
input, button { margin:5px 0; padding:8px; }
.type-select { margin:10px 0; }
</style>
</head>
<body>
<h1>Homework Tracker MVP</h1>

<h2>Create Account</h2>
<div class="type-select">
  <label><input type="radio" name="createType" value="student" checked> Student</label>
  <label><input type="radio" name="createType" value="teacher"> Teacher</label>
</div>
<input type="text" id="createUsername" placeholder="Username"><br>
<input type="password" id="createPassword" placeholder="Password"><br>
<button onclick="createAccount()">Create Account</button>

<h2>Login</h2>
<div class="type-select">
  <label><input type="radio" name="loginType" value="student" checked> Student</label>
  <label><input type="radio" name="loginType" value="teacher"> Teacher</label>
</div>
<input type="text" id="loginUsername" placeholder="Username"><br>
<input type="password" id="loginPassword" placeholder="Password"><br>
<button onclick="login()">Login</button>

<script>
function createAccount(){
    let type = document.querySelector('input[name="createType"]:checked').value;
    let username = document.getElementById("createUsername").value.trim();
    let password = document.getElementById("createPassword").value.trim();
    if(!username || !password){ alert("Fill in username and password"); return; }

    let key = type + "_" + username;
    if(localStorage.getItem(key)){ alert("Account already exists"); return; }

    localStorage.setItem(key, JSON.stringify({password: password}));
    alert(type.charAt(0).toUpperCase()+type.slice(1)+" account created!");
}

function login(){
    let type = document.querySelector('input[name="loginType"]:checked').value;
    let username = document.getElementById("loginUsername").value.trim();
    let password = document.getElementById("loginPassword").value.trim();
    if(!username || !password){ alert("Fill in username and password"); return; }

    let key = type + "_" + username;
    let data = JSON.parse(localStorage.getItem(key));
    if(!data){ alert("Account not found"); return; }
    if(data.password !== password){ alert("Incorrect password"); return; }

    // Save session
    sessionStorage.setItem("currentUser", username);
    sessionStorage.setItem("currentType", type);

    // Redirect to home/dashboard
    window.location.href = "home.html";
}
</script>
</body>
</html>
