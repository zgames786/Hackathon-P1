<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
window.onload = function(){
    let currentUser = sessionStorage.getItem("currentUser");
    let currentType = sessionStorage.getItem("currentType");
    if(!currentUser || !currentType){ alert("Not logged in"); window.location.href="index.html"; return; }
    document.getElementById("welcomeText").innerText = "Welcome, "+currentUser;

    // Only show chart for students
    if(currentType !== "student"){
        document.getElementById("progressChart").style.display="none";
        return;
    }

    // Gather all assignments from classes student is in
    let assignments=[];
    for(let key in localStorage){
        if(key.startsWith("class_")){
            let c=JSON.parse(localStorage.getItem(key));
            if(c.students && c.students.includes(currentUser) && c.assignments){
                assignments = assignments.concat(c.assignments.map(a=>{
                    if(!a.statuses) a.statuses={};
                    if(!a.statuses[currentUser]) a.statuses[currentUser]="active";
                    return a;
                }));
            }
        }
    }

    let total = assignments.length;
    let done = assignments.filter(a=>a.statuses[currentUser]==="done").length;
    let missing = assignments.filter(a=>a.statuses[currentUser]==="missing").length;
    let active = total - done - missing;

    // Convert to percentages
    let activePercent = total ? Math.round((active/total)*100) : 0;
    let donePercent = total ? Math.round((done/total)*100) : 0;
    let missingPercent = total ? Math.round((missing/total)*100) : 0;

    // Labels show both raw count and percent
    let labels = [
        `Active: ${active} (${activePercent}%)`,
        `Done: ${done} (${donePercent}%)`,
        `Missing: ${missing} (${missingPercent}%)`
    ];

    // Render chart
    new Chart(document.getElementById("progressChart"),{
        type:"doughnut",
        data:{
            labels: labels,
            datasets:[{
                data:[active,done,missing],
                backgroundColor:["#f0ad4e","#5cb85c","#d9534f"]
            }]
        },
        options:{
            responsive:true,
            plugins:{ legend:{ position:"bottom" } }
        }
    });
}
</script>
