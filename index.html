<style>
  body { font-family: Arial; margin: 0; padding: 0; }

  /* Move all content down so hamburger doesn't cover it */
  .page-content {
    padding-top: 80px; /* pushes content below hamburger */
  }

  /* Sidebar */
  #sidebar {
    height: 100%;
    width: 0;
    position: fixed;
    top: 0;
    left: 0;
    background-color: #111;
    overflow-x: hidden;
    transition: 0.3s;
    padding-top: 60px;
  }

  #sidebar a {
    padding: 10px 20px;
    text-decoration: none;
    font-size: 20px;
    color: white;
    display: block;
    transition: 0.2s;
  }

  #sidebar a:hover { background-color: #575757; }

  /* Hamburger button */
  #hamburger {
    font-size: 30px;
    cursor: pointer;
    padding: 10px 20px;
    background-color: #111;
    color: white;
    position: fixed;
    top: 0;
    left: 0;
  }

  /* Slightly bigger text */
  h1 { font-size: 36px; margin-bottom: 20px; }
  h2 { font-size: 28px; }
  input, button { font-size: 18px; }
  .assignment { font-size: 18px; margin-bottom: 5px; }

  /* Tabs */
  .tab-button { margin-right: 10px; padding: 5px 10px; cursor: pointer; }
  .tab-button.active { background-color: #007bff; color: white; }
  .hidden { display: none; }

</style>
