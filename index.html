<!DOCTYPE html>
<html>
<head>
  <title>Assignments</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 0; }
    
    /* Top bar */
    #topBar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #111;
      z-index: 1000;
      display: flex;
      align-items: center;
      padding-left: 10px;
      color: white;
      font-size: 30px;
      cursor: pointer;
    }

    /* Sidebar */
    #sidebar {
      height: 100%;
      width: 0;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #111;
      overflow-x: hidden;
      transition: 0.3s;
      padding-top: 60px;
      z-index: 999;
    }

    #sidebar a {
      padding: 10px 20px;
      text-decoration: none;
      font-size: 20px;
      color: white;
      display: block;
    }

    #sidebar a:hover { background-color: #575757; }

    /* Page content */
    .page { padding: 20px; margin-top: 60px; }

    h1 { font-size: 36px; margin-bottom: 20px; }
    h2 { font-size: 28px; }
    input, button { font-size: 18px; margin: 5px 0; }
    .assignment { font-size: 18px; margin-bottom: 5px; }

    .tab-button { margin-right: 10px; padding: 5px 10px; cursor: pointer; }
    .tab-button.active { background-color: #007bff; color: white; }
    .hidden { display: none; }

  </style>
</head>
<body>

  <div id="topBar" onclick="toggleSidebar()">☰</div>

  <div id="sidebar">
    <a href="#" onclick="showPage('home')">Home</a>
    <a href="#" onclick="showPage('assignments')">Assignments</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>

  <div id="homePage" class="page">
    <h1>Homework Tracker MVP</h1>
    <p>Welcome! Select Assignments from the sidebar to start tracking.</p>
  </div>

  <div id="assignmentsPage" class="page">
    <h1>Assignments</h1>

    <input id="classInput" placeholder="Class">
    <input id="assignmentInput" placeholder="Assignment">
    <button onclick="addAssignment()">Add Assignment</button>

    <div style="margin-top:20px;">
      <button class="tab-button active" onclick="showTab('active')">Active</button>
      <button class="tab-button" onclick="showTab('done')">Done</button>
      <button class="tab-button" onclick="showTab('missing')">Missing</button>
    </div>

    <div id="activeTab">
      <h2>Active Assignments</h2>
      <div id="activeAssignments"></div>
    </div>
    <div id="doneTab" class="hidden">
      <h2>Done Assignments</h2>
      <div id="doneAssignments"></div>
    </div>
    <div id="missingTab" class="hidden">
      <h2>Missing Assignments</h2>
      <div id="missingAssignments"></div>
    </div>

  </div>

  <script>
    const dueDate = "11/23/2025 12PM";

    // Check if user is logged in
    const currentUser = localStorage.getItem('currentUser');
    if(!currentUser) {
      alert('No user logged in! Redirecting to login.');
      window.location.href = 'login.html'; // replace with your login page
    }

    // Load user assignments
    function loadAssignments() {
      const users = JSON.parse(localStorage.getItem('users')) || {};
      const assignments = users[currentUser]?.assignments || [];

      // Clear current divs
      ['activeAssignments','doneAssignments','missingAssignments'].forEach(id => document.getElementById(id).innerHTML = '');

      // Populate
      assignments.forEach(a => {
        const div = document.createElement('div');
        div.className = 'assignment';
        div.innerHTML = `${a.class}: ${a.name} | Due: ${a.due} 
          <button onclick="markDone(this)">Done</button>
          <button onclick="markMissing(this)">Missing</button>`;
        
        if(a.status === 'active') document.getElementById('activeAssignments').appendChild(div);
        if(a.status === 'done') document.getElementById('doneAssignments').appendChild(div);
        if(a.status === 'missing') document.getElementById('missingAssignments').appendChild(div);
      });
    }

    // Save assignments for current user
    function saveAssignments() {
      const users = JSON.parse(localStorage.getItem('users')) || {};
      const assignments = [];

      ['activeAssignments','doneAssignments','missingAssignments'].forEach(status => {
        const divs = document.getElementById(status).children;
        for(let div of divs){
          const [text] = div.innerText.split(' | Due:');
          assignments.push({ 
            class: text.split(': ')[0],
            name: text.split(': ')[1],
            status: status.replace('Assignments','').toLowerCase(),
            due: dueDate
          });
        }
      });

      users[currentUser].assignments = assignments;
      localStorage.setItem('users', JSON.stringify(users));
    }

    function addAssignment() {
      let cls = document.getElementById("classInput").value.trim();
      let asn = document.getElementById("assignmentInput").value.trim();
      if(!cls || !asn) return;

      let div = document.createElement("div");
      div.className = "assignment";
      div.innerHTML = `${cls}: ${asn} | Due: ${dueDate} 
        <button onclick="markDone(this)">Done</button>
        <button onclick="markMissing(this)">Missing</button>`;
      document.getElementById("activeAssignments").appendChild(div);

      saveAssignments();
      document.getElementById("classInput").value = '';
      document.getElementById("assignmentInput").value = '';
    }

    function markDone(button){
      let div = button.parentElement;
      document.getElementById('doneAssignments').appendChild(div);
      saveAssignments();
    }

    function markMissing(button){
      let div = button.parentElement;
      document.getElementById('missingAssignments').appendChild(div);
      saveAssignments();
    }

    function showTab(tab) {
      ['activeTab','doneTab','missingTab'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById(tab+'Tab').classList.remove('hidden');

      document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
      document.querySelector(`.tab-button[onclick="showTab('${tab}')"]`).classList.add('active');
    }

    function toggleSidebar(){
      const sidebar = document.getElementById("sidebar");
      sidebar.style.width = sidebar.style.width === "200px" ? "0" : "200px";
    }

    function showPage(page){
      document.getElementById('homePage').style.display = 'none';
      document.getElementById('assignmentsPage').style.display = 'none';

      if(page==='home') document.getElementById('homePage').style.display = 'block';
      if(page==='assignments') document.getElementById('assignmentsPage').style.display = 'block';

      toggleSidebar();
    }

    function logout(){
      localStorage.removeItem('currentUser');
      window.location.href = 'login.html';
    }

    // Initialize
    showPage('home'); // start at home
    loadAssignments(); // load assignments for currentUser
  </script>
</body>
</html>
