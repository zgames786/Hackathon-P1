<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Homework Tracker Login</title>
  <style>
    body{margin:0;font-family:sans-serif;text-align:center;}
    .container{margin-top:100px;}
    .role-box{display:inline-block;width:150px;height:150px;margin:20px;border:2px solid #333;border-radius:10px;cursor:pointer;padding:10px;}
    .role-box h2{margin-top:20px;}
    input{margin:5px;padding:5px;}
    button{padding:5px 10px;margin:5px;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Homework Tracker Login</h1>
    <div>
      <div class="role-box" onclick="selectRole('student')">
        <div style="font-size:50px;">📚</div>
        <h2>Student</h2>
      </div>
      <div class="role-box" onclick="selectRole('teacher')">
        <div style="font-size:50px;">✏️</div>
        <h2>Teacher</h2>
      </div>
    </div>
    <div id="loginForm" style="display:none;margin-top:20px;">
      <h3 id="roleTitle"></h3>
      <input type="text" id="username" placeholder="Username"><br>
      <input type="password" id="password" placeholder="Password"><br>
      <button onclick="login()">Login</button>
      <button onclick="createAccount()">Create Account</button>
    </div>
  </div>

<script>
let selectedRole="";

function selectRole(role){
  selectedRole = role;
  document.getElementById("loginForm").style.display="block";
  document.getElementById("roleTitle").innerText = role.charAt(0).toUpperCase() + role.slice(1) + " Login";
}

function getUserDB(){
  return JSON.parse(localStorage.getItem(selectedRole+"_users")||"{}");
}

function saveUserDB(db){
  localStorage.setItem(selectedRole+"_users", JSON.stringify(db));
}

function createAccount(){
  let username=document.getElementById("username").value.trim();
  let password=document.getElementById("password").value.trim();
  if(!username || !password){ alert("Enter both"); return; }
  let db = getUserDB();
  if(db[username]){ alert("User exists"); return; }
  db[username] = password;
  saveUserDB(db);
  alert("Account created!");
}

function login(){
  let username=document.getElementById("username").value.trim();
  let password=document.getElementById("password").value.trim();
  let db = getUserDB();
  if(db[username] && db[username]===password){
    sessionStorage.setItem("currentUser", username);
    sessionStorage.setItem("currentType", selectedRole);
    localStorage.setItem("lastUser", username);
    localStorage.setItem("lastType", selectedRole);
    window.location.href="home.html";
  } else {
    alert("Invalid login");
  }
}
</script>
</body>
</html>
